<title>Taskling</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: one narrow phone-like column. Home = stats, habits, tracks. Track = a winding path of step nodes grouped by section, with a bottom sheet per step. */
:root{
  --bg:#f3f6f4; --surface:#ffffff; --ink:#15302b; --muted:#5b726c; --line:#d5e0dc;
  --accent:#e8a317; --accent-ink:#3b2700; --deep:#1f5c50; --deep-ink:#ffffff;
  --good:#2f9e5b; --good-bg:#dff3e6; --bad:#d4493b; --locked:#d3ddda;
  --s1:#1f7a66; --s2:#7a4fc4; --s3:#2a72c9; --s4:#c4523f;
  --gem:#2f6fd6; --ice:#7cc3ea; --ice-ink:#08324a; --wood:#b0652c; --wood-dk:#7d4319; --rim:#5b3415;
  --shadow:0 3px 0 var(--line);
  --f-display:"Bricolage Grotesque",ui-rounded,system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1b19; --surface:#162724; --ink:#e4efeb; --muted:#93aba4; --line:#2a403b;
  --accent:#f0b43a; --accent-ink:#2a1b00; --deep:#3f9c87; --deep-ink:#06110f;
  --good:#5cc985; --good-bg:#183a27; --bad:#f07466; --locked:#2f4742;
  --s1:#238a73; --s2:#8559d1; --s3:#3478d1; --s4:#c95a46;
  --gem:#6ea2ff; --ice:#4fa6d4; --ice-ink:#04202f; --wood:#b8703a; --wood-dk:#875027; --rim:#4a2b12; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1b19; --surface:#162724; --ink:#e4efeb; --muted:#93aba4; --line:#2a403b;
  --accent:#f0b43a; --accent-ink:#2a1b00; --deep:#3f9c87; --deep-ink:#06110f;
  --good:#5cc985; --good-bg:#183a27; --bad:#f07466; --locked:#2f4742;
  --s1:#238a73; --s2:#8559d1; --s3:#3478d1; --s4:#c95a46;
  --gem:#6ea2ff; --ice:#4fa6d4; --ice-ink:#04202f; --wood:#b8703a; --wood-dk:#875027; --rim:#4a2b12; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--f-body)}
.app{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:16px 48px;display:flex;flex-direction:column;gap:22px;box-sizing:border-box}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;line-height:1.15}
h1{font-size:1.9rem;font-weight:800;letter-spacing:-.02em}
h2{font-size:1.3rem;font-weight:700}
p{margin:0}
.muted{color:var(--muted)}
.label{font:700 .72rem/1.2 var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
button{font:inherit;cursor:pointer;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn{border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:.65em 1.05em;font-weight:700;box-shadow:var(--shadow);transition:transform .08s}
.btn:active{transform:translateY(2px);box-shadow:none}
.btn.primary{background:var(--deep);border-color:var(--deep);color:var(--deep-ink);box-shadow:0 3px 0 color-mix(in srgb,var(--deep) 60%,#000)}
.btn.gold{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);box-shadow:0 3px 0 color-mix(in srgb,var(--accent) 60%,#000)}
.btn.ghost{border-color:transparent;background:transparent;box-shadow:none;color:var(--muted)}
.btn.small{padding:.3em .6em;font-size:.9rem}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn.wide{width:100%}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.stats{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:flex;align-items:center;gap:6px;border:2px solid var(--line);border-radius:999px;padding:4px 12px;background:var(--surface);font-weight:700}
.chip svg{width:18px;height:18px;color:var(--accent)}
/* summary card */
.card{background:var(--surface);border:2px solid var(--line);border-radius:20px;padding:16px}
.goal{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.ring{width:76px;height:76px}
.ring circle{fill:none;stroke-width:9}
.ring .track{stroke:var(--line)} .ring .fill{stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset .6s}
.ring text{fill:var(--ink);font:700 15px var(--f-mono);text-anchor:middle;dominant-baseline:central}
.week{display:flex;gap:6px;margin-top:8px}
.day{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font:700 .7rem var(--f-mono);background:var(--bg);color:var(--muted);border:1.5px solid var(--line)}
.day.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.lvl{display:flex;flex-direction:column;gap:6px;margin-top:14px;padding-top:14px;border-top:1.5px solid var(--line)}
.bar{height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--good);border-radius:99px;transition:width .4s}
.bar.gold>i{background:var(--accent)}
/* habits */
.habits{display:flex;flex-direction:column;gap:8px}
.habit{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:10px 12px}
.habit.on{border-color:var(--good);background:var(--good-bg)}
.tick{width:34px;height:34px;border-radius:10px;border:2px solid var(--line);background:var(--bg);display:grid;place-items:center}
.tick svg{width:20px;height:20px;opacity:0}
.habit.on .tick{background:var(--good);border-color:var(--good);color:#fff}
.habit.on .tick svg{opacity:1}
.habit .name{min-width:0;overflow-wrap:anywhere;font-weight:700}
.habit .meta{font-size:.82rem;color:var(--muted);font-weight:400}
.hstreak{display:flex;align-items:center;gap:4px;font-weight:700}
.hstreak svg{width:16px;height:16px;color:var(--accent)}
/* tracks */
.tracks{display:flex;flex-direction:column;gap:12px}
.trackcard{background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:14px 16px;display:grid;grid-template-columns:1fr auto;gap:10px 12px;align-items:center;text-align:left;box-shadow:var(--shadow);width:100%}
.trackcard h3{font-size:1.1rem;min-width:0;overflow-wrap:anywhere}
.trackcard .meta{font-size:.85rem;color:var(--muted)}
.trackcard .bar{grid-column:1/-1}
.trackcard .next{grid-column:1/-1;font-size:.9rem;min-width:0;overflow-wrap:anywhere}
.badge{font:700 .75rem var(--f-mono);padding:4px 8px;border-radius:8px;background:var(--bg);border:1.5px solid var(--line)}
.badge.won{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.empty{border:2px dashed var(--line);border-radius:18px;padding:22px;display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.tag{font:700 .65rem/1 var(--f-body);letter-spacing:.06em;text-transform:uppercase;padding:3px 6px;border-radius:6px;background:var(--bg);color:var(--muted);vertical-align:middle;margin-left:6px}
/* form */
.field{display:flex;flex-direction:column;gap:6px}
input[type=text],textarea{font:inherit;color:var(--ink);background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:.65em .8em;width:100%;box-sizing:border-box}
textarea{min-height:220px;resize:vertical;font-family:var(--f-mono);font-size:.86rem;line-height:1.55}
input:focus,textarea:focus{outline:none;border-color:var(--deep)}
.note{font-size:.85rem;color:var(--muted)}
.note code{font-family:var(--f-mono);font-size:.8rem;background:var(--surface);border:1px solid var(--line);border-radius:5px;padding:0 4px}
.err{color:var(--bad);font-size:.9rem}
.preview{border:2px solid var(--line);border-radius:14px;background:var(--surface);padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.preview ol{margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:2px}
.preview li{overflow-wrap:anywhere}
.xpl{font:700 .72rem var(--f-mono);color:var(--muted)}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}
/* game map */
.trackhead{position:sticky;top:env(safe-area-inset-top,0px);z-index:3;background:var(--bg);padding-block:8px 10px;display:flex;flex-direction:column;gap:6px;border-bottom:2px solid var(--line);margin-inline:-16px;padding-inline:16px}
.map{display:flex;flex-direction:column;gap:8px}
.sec{display:flex;flex-direction:column}
.unit{border-radius:18px;padding:14px 16px;background:var(--col);color:#fff;display:flex;justify-content:space-between;gap:12px;align-items:center;box-shadow:0 4px 0 color-mix(in srgb,var(--col) 60%,#000)}
.unit .label{color:inherit;opacity:.85}
.unit h3{font-size:1.2rem;overflow-wrap:anywhere;min-width:0}
.unitcount{font-weight:700;background:color-mix(in srgb,#000 18%,transparent);padding:4px 10px;border-radius:10px}
.path{display:flex;flex-direction:column;align-items:center;gap:22px;padding-block:34px 30px}
.nodewrap{display:flex;flex-direction:column;align-items:center;gap:8px}
.node{position:relative;width:76px;height:70px;border-radius:50%;border:0;display:grid;place-items:center;transition:transform .1s;
  --c:var(--locked);background:var(--c);color:var(--muted);box-shadow:0 7px 0 color-mix(in srgb,var(--c) 62%,#000)}
.node svg{width:32px;height:32px}
button.node:active{transform:translateY(5px);box-shadow:0 2px 0 color-mix(in srgb,var(--c) 62%,#000)}
.node.done{--c:var(--accent);color:var(--accent-ink)}
.node.cur{--c:var(--col);color:#fff}
.node.cur::after{content:"";position:absolute;inset:-11px;border-radius:50%;border:5px solid color-mix(in srgb,var(--col) 40%,transparent);animation:pulse 1.8s ease-in-out infinite}
.node.chest{width:70px;height:64px;cursor:default}
.node.chest.done,.node.chest.open{--c:var(--accent);color:var(--accent-ink)}
.node.unlock{animation:unlock .6s ease-out}
.startbubble{position:absolute;bottom:calc(100% + 16px);left:50%;transform:translateX(-50%);background:var(--surface);color:var(--col);border:2px solid var(--line);border-radius:12px;padding:5px 12px;font:800 .8rem var(--f-display);letter-spacing:.08em;white-space:nowrap;animation:bob 1.6s ease-in-out infinite}
.startbubble::after{content:"";position:absolute;top:100%;left:50%;margin-left:-7px;border:7px solid transparent;border-top-color:var(--line)}
.steplabel{font:700 .75rem var(--f-mono);color:var(--muted)}
.pop{position:relative;width:min(300px,100%);box-sizing:border-box;background:var(--col);color:#fff;border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:10px;margin-top:-6px;animation:popin .18s ease-out;box-shadow:0 4px 0 color-mix(in srgb,var(--col) 60%,#000)}
.pop::before{content:"";position:absolute;bottom:100%;left:calc(50% + var(--arrow) - 9px);border:9px solid transparent;border-bottom-color:var(--col)}
.pop h3{font-size:1.15rem;overflow-wrap:anywhere}
.pop .label,.pop .note{color:inherit;opacity:.9}
.pop .badge{background:color-mix(in srgb,#000 18%,transparent);border-color:transparent;color:#fff}
.pop .btn{color:var(--ink)}
.btn.start{background:#fff;border-color:#fff;color:var(--col)!important;font-family:var(--f-display);font-weight:800;letter-spacing:.06em;text-transform:uppercase;box-shadow:0 3px 0 color-mix(in srgb,var(--col) 55%,#000)}
.finale{display:flex;flex-direction:column;align-items:center;gap:8px;padding:16px;text-align:center;color:var(--muted)}
.finale svg{width:84px;height:84px;color:var(--locked)}
.finale.won svg{color:var(--accent)}
@keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.08);opacity:.45}}
@keyframes bob{0%,100%{transform:translate(-50%,0)}50%{transform:translate(-50%,-4px)}}
@keyframes popin{from{transform:scale(.92);opacity:0}to{transform:none;opacity:1}}
@keyframes unlock{0%{transform:scale(.6)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
.checks{display:flex;flex-direction:column;gap:6px}
.check{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:2px solid var(--line);border-radius:12px;background:var(--bg);text-align:left;overflow-wrap:anywhere}
.check .box{width:20px;height:20px;border-radius:6px;border:2px solid var(--line);flex:none;display:grid;place-items:center;margin-top:2px;background:var(--surface)}
.check .box svg{width:14px;height:14px;opacity:0}
.check.on .box{background:var(--good);border-color:var(--good);color:#fff}
.check.on .box svg{opacity:1}
.check.on span:last-child{text-decoration:line-through;color:var(--muted)}
.chip.gems svg{color:var(--gem)}
button.chip{cursor:pointer}
.day.ice{background:var(--ice);color:var(--ice-ink);border-color:var(--ice)}
.freezes{display:flex;align-items:center;gap:6px;font-size:.85rem;color:var(--muted)}
.freezes svg{width:16px;height:16px;color:var(--ice)}
.shopcard{box-sizing:border-box;display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;text-align:left;width:100%;background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:14px 16px;box-shadow:var(--shadow)}
.shopcard .gemicon{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb,var(--gem) 14%,var(--surface));color:var(--gem)}
.shopcard .gemicon svg{width:24px;height:24px}
.shopcard .gemicon.ice{background:color-mix(in srgb,var(--ice) 22%,var(--surface));color:var(--ice)}
.shopcard .name{min-width:0;overflow-wrap:anywhere;font-weight:700}
.shopcard .meta{font-size:.82rem;color:var(--muted);font-weight:400}
.rewards{display:flex;flex-direction:column;gap:10px}
.price{display:inline-flex;align-items:center;gap:4px;font:700 .95rem var(--f-mono)}
.price svg{width:16px;height:16px;color:var(--gem)}
.balance{display:flex;align-items:center;gap:14px;background:var(--surface);border:2px solid var(--line);border-radius:20px;padding:16px}
.balance svg{width:44px;height:44px;color:var(--gem)}
.balance .num{font-size:2rem;font-weight:700;line-height:1}
.log{display:flex;flex-direction:column;border:2px solid var(--line);border-radius:14px;background:var(--surface);overflow:hidden}
.log div{display:grid;grid-template-columns:1fr auto auto;gap:10px;padding:8px 12px;border-top:1px solid var(--line);font-size:.9rem;align-items:center}
.log div:first-child{border-top:0}
.log span{min-width:0;overflow-wrap:anywhere}
.suggest{display:flex;gap:6px;flex-wrap:wrap}
input[type=number]{font:inherit;color:var(--ink);background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:.65em .6em;width:6.5em;box-sizing:border-box;font-family:var(--f-mono)}
.sel{font:inherit;color:var(--ink);background:var(--surface);border:2px solid var(--line);border-radius:10px;padding:.35em .5em;max-width:100%;min-width:0;flex:1}
body.dropping .app{outline:3px dashed var(--deep);outline-offset:-8px;border-radius:20px}
.timer{background:var(--surface);border:2px solid var(--line);border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:12px}
.timer.break{border-color:var(--ice)}
.timer .est{gap:2px}
.tbody{position:relative;width:180px;height:180px;margin:0 auto;max-width:100%}
.tring{width:100%;height:100%}
.tring circle{fill:none;stroke-width:9}
.tring .track{stroke:var(--line)} .tring .fill{stroke:var(--deep);stroke-linecap:round;transition:stroke-dashoffset .3s linear}
.timer.break .tring .fill{stroke:var(--ice)} .timer.over .tring .fill{stroke:var(--accent)}
.tcenter{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.tclock{font-size:2.4rem;font-weight:700;line-height:1}
.dots{display:flex;justify-content:center;gap:6px;flex-wrap:wrap}
.dots i{width:12px;height:12px;border-radius:50%;background:var(--line)}
.dots i.cur{background:var(--deep);box-shadow:0 0 0 3px color-mix(in srgb,var(--deep) 30%,transparent)}
.dots i.on{background:var(--accent)}
.tmini{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:15;display:flex;align-items:center;gap:8px;max-width:calc(100% - 32px);box-sizing:border-box;background:var(--deep);color:var(--deep-ink);border:0;border-radius:999px;padding:10px 16px;font-weight:700;box-shadow:0 4px 0 color-mix(in srgb,var(--deep) 55%,#000)}
.tmini svg{width:18px;height:18px;flex:none}
.tmini[hidden]{display:none}
.tminititle{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:400;max-width:12em}
.cheststage{display:flex;flex-direction:column;align-items:center;gap:8px;padding-block:6px}
.chestbtn{border:0;background:none;padding:0;cursor:pointer;animation:bobchest 1.4s ease-in-out infinite;border-radius:16px}
.chestsvg{width:150px;height:auto;display:block}
.cheststage.big .chestsvg{width:180px}
.chestsvg .lid,.chestsvg .body{fill:var(--wood)} .chestsvg .lid{fill:var(--wood-dk)}
.chestsvg .band,.chestsvg .lock{fill:var(--accent)} .chestsvg .rim{fill:var(--rim)} .chestsvg .keyhole{fill:var(--rim)}
.chestsvg.gold .body{fill:var(--accent)} .chestsvg.gold .lid{fill:color-mix(in srgb,var(--accent) 75%,#000)} .chestsvg.gold .band,.chestsvg.gold .lock{fill:var(--gem)}
.chestsvg .rays rect{fill:var(--accent);opacity:.55}
.chestsvg .rays{transform-origin:70px 52px;animation:spin 6s linear infinite}
.chestsvg .glow{fill:var(--accent);opacity:.35}
.loot{display:flex;align-items:center;gap:6px;font-size:1.6rem;font-weight:700;color:var(--gem)}
.loot svg{width:26px;height:26px}
.jp{font:800 .8rem var(--f-display);letter-spacing:.08em;text-transform:uppercase;background:var(--accent);color:var(--accent-ink);padding:3px 8px;border-radius:8px}
.chestbtn.shake{animation:chestshake .45s ease-in-out}
@keyframes bobchest{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes chestshake{0%,100%{transform:rotate(0)}20%{transform:rotate(-8deg) scale(1.05)}40%{transform:rotate(8deg) scale(1.08)}60%{transform:rotate(-6deg) scale(1.1)}80%{transform:rotate(4deg) scale(1.12)}}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.chestbtn,.chestsvg .rays,.chestbtn.shake{animation:none}}
img.ico{width:1.2em;height:1.2em;object-fit:contain;vertical-align:middle;flex:none}
.node img.ico{width:34px;height:34px} .finale img.ico{width:84px;height:84px} .balance img.ico{width:44px;height:44px} .gemicon img.ico{width:24px;height:24px}
.chestimg{width:150px;height:auto;object-fit:contain}
.testbar{background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--accent) 22%,var(--bg)) 0 14px,var(--bg) 14px 28px);border-bottom:2px solid var(--accent);padding-inline:16px;padding-block:10px}
.testbar[hidden]{display:none}
.testinner{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:8px;background:var(--surface);border:2px solid var(--accent);border-radius:14px;padding:10px 12px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:700;max-width:calc(100% - 32px);z-index:30}
.reward{position:fixed;inset:0;z-index:20;display:grid;place-items:center;pointer-events:none}
.reward .burst{font:800 2.6rem var(--f-display);color:var(--accent);text-shadow:0 3px 0 color-mix(in srgb,var(--accent) 45%,#000);animation:rise 1.1s ease-out forwards;text-align:center;padding-inline:16px}
.reward .burst small{display:block;font-size:1rem;color:var(--ink);text-shadow:none}
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:19}
@keyframes rise{0%{transform:scale(.6);opacity:0}25%{transform:scale(1.1);opacity:1}70%{opacity:1}100%{transform:translateY(-40px);opacity:0}}
/* focus mode */
.focus{display:flex;flex-direction:column;gap:20px;min-height:calc(100vh - 64px)}
.lbar{display:flex;align-items:center;gap:12px}
.lbar .bar{flex:1;height:14px}
.taskcard{background:var(--surface);border:2px solid var(--line);border-top:8px solid var(--col);border-radius:22px;padding:20px;display:flex;flex-direction:column;gap:14px}
.taskcard h2{font-size:1.75rem;font-weight:800;overflow-wrap:anywhere}
.spacer{flex:1}

<div class="testbar" id="testbar" hidden></div>
<div class="app" id="app">
  <div class="top"><h1>Taskling</h1></div>
  <p class="muted">Loading your tracks…</p>
</div>
<div id="layer"></div>
<canvas id="confetti" hidden></canvas>
<button class="tmini" id="tmini" hidden aria-label="Open the running timer"></button>
<div class="toast" id="toast" hidden></div>

<script>
(() => {
const $app = document.getElementById('app'), $layer = document.getElementById('layer');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
/* ---------- test mode: a sandbox profile kept in this browser, with fast timers and pretend days ---------- */
let TEST = { on: false, fast: true, dayOffset: 0, jackpot: false };
try { Object.assign(TEST, JSON.parse(localStorage.getItem('taskling.testmode')) || {}); } catch (e) {}
const saveTest = () => { try { localStorage.setItem('taskling.testmode', JSON.stringify(TEST)); } catch (e) {} };
const clockNow = () => new Date(Date.now() + (TEST.on ? TEST.dayOffset * 864e5 : 0));
const dayKey = (d = clockNow()) => d.toLocaleDateString('en-CA');
const daysAgo = n => { const d = clockNow(); d.setDate(d.getDate() - n); return dayKey(d); };
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
/* ===================== ARTWORK — swap in your own graphics here =====================
   Set any entry to an image URL or a data: URI (PNG, SVG, WebP, GIF) to replace the built-in drawing.
   Leave it null to keep the default. Square images work best for icons; chests look best around 140×120.
   Icons: flame (streak), bolt (XP), gem, ice (streak freeze), check (finished level), star (current level),
          lock (locked level), chest (section chest on the map), trophy (track finish), clock (timer).
   Chests (the reward you tap after a level): chestClosed, chestOpen, sectionChestClosed, sectionChestOpen. */
const ART = {
  flame: null, bolt: null, gem: null, ice: null, check: null, star: null, lock: null, chest: null, trophy: null, clock: null,
  chestClosed: null, chestOpen: null, sectionChestClosed: null, sectionChestOpen: null,
};
const artImg = (name, cls = 'ico') => ART[name] ? `<img class="${cls}" src="${String(ART[name]).replace(/"/g, '&quot;')}" alt="">` : null;
/* ==================================================================================== */
const ICON = {
  flame: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2c1 4 5 5.5 5 10.5A5 5 0 0 1 7 12.5c0-2 1-3.5 2-4.5 0 2 1 3 2 3 0-3-1-6 1-9z"/></svg>',
  bolt: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg>',
  check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5 10 17 19 7"/></svg>',
  star: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="m12 2.5 2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.4l-5.9 3.1 1.2-6.5L2.5 9.4l6.6-.9z"/></svg>',
  dot: '<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="5"/></svg>',
  gem: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 3h10l4 6-9 12L3 9zm1.2 2-2 3.5h3.3L11 5zm4.8 0 1.5 3.5h3.3l-2-3.5zm-4 5.5L11 17l-1.9-6.5zm6 0L13 17l2.9-6.5zM11.3 10.5h1.4L12 13z"/></svg>',
  ice: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 2v20M3.3 7l17.4 10M3.3 17 20.7 7M9 4l3 2 3-2M9 20l3-2 3 2"/></svg>',
  clock: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2M9.5 2.5h5"/></svg>',
  lock: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 10V8a5 5 0 0 1 10 0v2h1a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1v-9a1 1 0 0 1 1-1zm2 0h6V8a3 3 0 0 0-6 0z"/></svg>',
  chest: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 9a4 4 0 0 1 4-4h10a4 4 0 0 1 4 4v1H3zm0 2h7v2h4v-2h7v8a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"/></svg>',
  trophy: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 3h12v2h3v3a4 4 0 0 1-4 4h-.3A5 5 0 0 1 13 15v3h3v3H8v-3h3v-3a5 5 0 0 1-3.7-3H7a4 4 0 0 1-4-4V5h3zm-1 4v1a2 2 0 0 0 1.4 1.9L6 7zm14 0h-1l-.4 2.9A2 2 0 0 0 19 8z"/></svg>'
};
for (const k in ICON) { const img = artImg(k); if (img) ICON[k] = img; }
const SIZE_XP = { S: 10, M: 20, L: 40 };
/* Level chests: a gem range scaled to the task's XP. Two dice averaged so mid values are common and the edges feel lucky; 1 in 10 is a jackpot. */
const chestRange = st => { const xp = SIZE_XP[st.size]; return [Math.round(xp * .3), Math.round(xp * .9)]; };
const JACKPOT_ODDS = 0.1;
function rollChest([lo, hi]) {
  if (TEST.on && TEST.jackpot) { TEST.jackpot = false; saveTest(); renderTestBar(); return { gems: hi * 2, jackpot: true }; }
  if (Math.random() < JACKPOT_ODDS) return { gems: hi * 2, jackpot: true };
  return { gems: lo + Math.round(((Math.random() + Math.random()) / 2) * (hi - lo)), jackpot: false };
}
const TRACK_BONUS = 150, CHEST_MIN = 20, CHEST_MAX = 80, FREEZE_COST = 200, FREEZE_CAP = 3;

/* ---------- storage: private per-viewer db, else this browser ---------- */
const LS = 'taskling.v2', LS_TEST = 'taskling.test.v1';
const lsKey = () => store.mode === 'test' ? LS_TEST : LS;
const store = {
  mode: 'local', col: null,
  async init() {
    try {
      const [db, user] = await Promise.all([claude.use('db'), claude.use('user')]);
      const id = user ? await user.id() : null;
      if (db && id) { this.col = db.collection('data/users/' + id); this.mode = 'db'; }
    } catch (e) {}
  },
  async load() {
    if (this.mode === 'db') {
      try {
        const snap = await this.col.get();
        const out = { tracks: [], progress: null };
        snap.docs.forEach(d => {
          if (d.id === 'progress') out.progress = JSON.parse(JSON.stringify(d.data()));
          else if (d.id.startsWith('track-')) out.tracks.push(JSON.parse(JSON.stringify(d.data())));
        });
        return out;
      } catch (e) { this.mode = 'local'; }
    }
    try { return JSON.parse(localStorage.getItem(lsKey())) || {}; } catch (e) { return {}; }
  },
  saveTrack(t) { return this.mode === 'db' ? this._w(this.col.doc('track-' + t.id).set(t)) : this._local(); },
  deleteTrack(id) { return this.mode === 'db' ? this._w(this.col.doc('track-' + id).delete()) : this._local(); },
  saveProgress() { return this.mode === 'db' ? this._w(this.col.doc('progress').set(S.p)) : this._local(); },
  async _w(p) { try { await p; } catch (e) { toast(e?.code === 'quota_exceeded' ? 'Storage is full. Delete a track to make room.' : 'Could not save. Your change is kept for this visit.'); } },
  _local() { try { localStorage.setItem(lsKey(), JSON.stringify({ tracks: S.tracks, progress: S.p })); } catch (e) {} }
};

/* ---------- state ---------- */
const S = { tracks: [], p: null, view: 'home', trackId: null, sheet: null, editId: null, confirmDel: false, habitEdit: false, sample: null, draft: '' };
const freshProgress = () => ({ xp: 0, goal: 50, streak: 0, lastDay: null, days: {}, habits: [], gems: 0, freezes: 1, freezeWeek: null, frozen: {}, shop: [], purchases: [] });

function toast(msg) {
  const t = document.getElementById('toast'); t.textContent = msg; t.hidden = false;
  clearTimeout(toast.t); toast.t = setTimeout(() => t.hidden = true, 2600);
}

/* ---------- XP, levels, streaks ---------- */
const level = xp => Math.floor(Math.sqrt(xp / 40)) + 1;
const levelFloor = n => 40 * (n - 1) ** 2;
const xpToday = () => S.p.days[dayKey()] || 0;
const liveStreak = () => (S.p.lastDay === dayKey() || S.p.lastDay === daysAgo(1)) ? S.p.streak : 0;
/* every XP point also pays half a gem; taking XP back takes the gems back */
const gemsFor = xp => Math.round(xp / 2);
function award(xp, flatGems = true) {
  reconcile();
  const p = S.p, k = dayKey();
  p.xp = Math.max(0, p.xp + xp); p.days[k] = Math.max(0, (p.days[k] || 0) + xp);
  if (flatGems) p.gems = Math.max(0, (p.gems || 0) + gemsFor(xp));
  if (xp > 0 && p.lastDay !== k) { p.streak = liveStreak() + 1; p.lastDay = k; }
  const keep = Object.keys(p.days).sort().slice(-90); p.days = Object.fromEntries(keep.map(d => [d, p.days[d]]));
}
const weekKey = () => { const d = clockNow(); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return dayKey(d); };
const daysBetween = (a, b) => Math.round((new Date(b + 'T12:00') - new Date(a + 'T12:00')) / 864e5);
/* Weekly free freeze, then spend freezes to cover days missed since the streak was last fed. Returns a message when something happened. */
function reconcile() {
  const p = S.p; let msg = '';
  p.frozen = p.frozen || {};
  const wk = weekKey();
  if (p.freezeWeek !== wk) { if (p.freezeWeek) p.freezes = Math.min(FREEZE_CAP, (p.freezes || 0) + 1); p.freezeWeek = wk; }
  if (p.lastDay && p.streak > 0) {
    const missed = daysBetween(p.lastDay, dayKey()) - 1;
    if (missed >= 1) {
      if ((p.freezes || 0) >= missed) {
        p.freezes -= missed;
        for (let i = 1; i <= missed; i++) p.frozen[daysAgo(i)] = 1;
        p.lastDay = daysAgo(1);
        msg = `${missed === 1 ? 'A streak freeze' : missed + ' streak freezes'} kept your ${p.streak}-day streak alive.`;
      } else { msg = p.streak > 1 ? `Your ${p.streak}-day streak ended. Start a new one today.` : ''; p.streak = 0; }
    }
  }
  const cutoff = daysAgo(30); for (const d in p.frozen) if (d < cutoff) delete p.frozen[d];
  return msg;
}
const habitStreak = h => { let n = 0, i = h.log[dayKey()] ? 0 : 1; while (h.log[daysAgo(i)]) { n++; i++; } return n; };

/* ---------- doc parsing ---------- */
/* Headings or "Something:" lines start a section. Top-level bullets / numbered lines are steps.
   Deeper-indented bullets become a checklist inside the step. [S] [M] [L] sets effort; - [x] marks it done. */
function parseDoc(text) {
  let fileId = null;
  const fm = text.match(/^\uFEFF?---\r?\n([\s\S]*?)\r?\n---\r?\n?/);
  if (fm) { fileId = (fm[1].match(/^taskling-id:\s*(\S+)/m) || [])[1] || null; text = text.slice(fm[0].length); }
  const lines = text.replace(/\t/g, '    ').split(/\r?\n/);
  const bulletRe = /^(\s*)(?:[-*+•]|\d+[.)]|[a-z][.)])\s+(?:\[([ xX])\]\s*)?(.+)$/;
  const hasBullets = lines.some(l => bulletRe.test(l));
  let name = '', sections = [], cur = null, last = null, base = null;
  const sec = title => { cur = { id: uid(), title, steps: [] }; sections.push(cur); last = null; base = null; };
  const step = (raw, done) => {
    if (!cur) sec('Steps');
    let size = 'M', mins = null, title = raw.trim(), m;
    for (let k = 0; k < 3; k++) {
      if ((m = title.match(/\s*[\[(](S|M|L|small|medium|large)[\])]\s*$/i) || title.match(/^[\[(](S|M|L)[\])]\s*/i))) { size = m[1][0].toUpperCase(); title = title.replace(m[0], ' ').trim(); }
      else if ((m = title.match(/\s*[\[(]~?\s*(?:(\d+(?:\.\d+)?)\s*h(?:rs?|ours?)?)?\s*(?:(\d+)\s*m(?:in(?:s|utes?)?)?)?[\])]\s*$/i)) && (m[1] || m[2])) {
        mins = Math.min(600, Math.max(5, Math.round((+m[1] || 0) * 60 + (+m[2] || 0)))); title = title.replace(m[0], ' ').trim();
      } else break;
    }
    title = title.replace(/\*\*|__/g, '');
    last = { id: uid(), title, size, checks: [], done: !!done, doneDay: done ? 'imported' : null }; if (mins) last.mins = mins;
    cur.steps.push(last);
  };
  for (const l of lines) {
    if (!l.trim()) continue;
    const h = l.match(/^\s*#{1,6}\s+(.+)$/);
    if (h) { const t = h[1].replace(/[#*_]/g, '').trim(); if (!name && /^\s*#\s/.test(l)) name = t; else sec(t); continue; }
    const b = l.match(bulletRe);
    if (b) {
      const indent = b[1].length, done = b[2] && b[2] !== ' ';
      if (base === null || indent <= base || !last) { base = base === null ? indent : Math.min(base, indent); step(b[3], done); }
      else last.checks.push({ t: b[3].replace(/\*\*|__/g, '').trim(), on: !!done });
      continue;
    }
    const t = l.trim();
    if (/:$/.test(t) && t.length < 80) { sec(t.slice(0, -1)); continue; }
    if (!hasBullets) step(t, false);
    else if (!name && !sections.length) name = t.replace(/[*_]/g, '');
  }
  sections = sections.filter(s => s.steps.length);
  return { name, sections, fileId };
}
function toDoc(t, withId) {
  let out = (withId ? `---\ntaskling-id: ${t.id}\n---\n` : '') + `# ${t.name}\n`;
  for (const s of t.sections) {
    out += `\n## ${s.title}\n`;
    for (const st of s.steps) {
      out += `- [${st.done ? 'x' : ' '}] ${st.title}${st.size !== 'M' ? ` [${st.size}]` : ''}${st.mins ? ` [${fmtMins(st.mins).replace(' ', '')}]` : ''}\n`;
      for (const c of st.checks) out += `    - [${c.on ? 'x' : ' '}] ${c.t}\n`;
    }
  }
  return out;
}

/* ---------- track helpers ---------- */
const allSteps = t => t.sections.flatMap(s => s.steps);
const trackPct = t => { const a = allSteps(t); return a.length ? Math.round(100 * a.filter(s => s.done).length / a.length) : 0; };
const nextStep = t => allSteps(t).find(s => !s.done);

/* ---------- render ---------- */
function render() {
  ({ home: renderHome, track: renderTrack, edit: renderEdit, focus: renderFocus, shop: renderShop, import: renderImport })[S.view]();
  miniTimer();
}
const header = () => `<div class="top"><h1>Taskling</h1><div class="stats">
  <span class="chip" title="Day streak">${ICON.flame}<span class="num">${liveStreak()}</span></span>
  <button class="chip gems" id="gemchip" title="Gems: open the reward shop">${ICON.gem}<span class="num">${S.p.gems}</span></button></div></div>`;

function renderHome() {
  const p = S.p, xp = xpToday(), frac = Math.min(1, xp / p.goal), C = 2 * Math.PI * 32;
  const lv = level(p.xp), lo = levelFloor(lv), hi = levelFloor(lv + 1);
  const week = [...Array(7)].map((_, i) => { const k = daysAgo(6 - i), d = new Date(k + 'T12:00'); return { l: 'SMTWTFS'[d.getDay()], on: (p.days[k] || 0) > 0, ice: !!p.frozen?.[k] }; });
  const tracks = S.tracks.slice().sort((a, b) => (trackPct(a) === 100) - (trackPct(b) === 100) || (b.touched || 0) - (a.touched || 0));
  $app.innerHTML = `${header()}
  <section class="card">
    <div class="goal">
      <svg class="ring" viewBox="0 0 76 76" role="img" aria-label="Daily goal ${xp} of ${p.goal} XP">
        <circle class="track" cx="38" cy="38" r="32"/><circle class="fill" cx="38" cy="38" r="32" stroke-dasharray="${C}" stroke-dashoffset="${C * (1 - frac)}" transform="rotate(-90 38 38)"/>
        <text x="38" y="38">${Math.round(frac * 100)}%</text></svg>
      <div><div class="label">Daily goal</div><div><b class="num">${xp}</b> / <span class="num">${p.goal}</span> XP today
        <button class="btn ghost small" id="goal">change</button></div>
        <div class="week">${week.map(d => `<span class="day ${d.on ? 'on' : d.ice ? 'ice' : ''}" ${d.ice ? 'title="Covered by a streak freeze"' : ''}>${d.l}</span>`).join('')}</div>
        <div class="freezes" style="margin-top:8px">${ICON.ice}<span><span class="num">${p.freezes}</span> streak freeze${p.freezes === 1 ? '' : 's'} ready · 1 free each week</span></div></div>
    </div>
    <div class="lvl"><div class="row between"><span class="label">Level <span class="num">${lv}</span></span><span class="note num">${p.xp - lo} / ${hi - lo} XP to level ${lv + 1}</span></div>
      <div class="bar gold"><i style="width:${Math.round(100 * (p.xp - lo) / (hi - lo))}%"></i></div></div>
  </section>

  ${shopTeaser()}

  <section class="habits">
    <div class="row between"><h2>Daily habits</h2><button class="btn ghost small" id="hedit">${S.habitEdit ? 'Done' : p.habits.length ? 'Edit' : ''}</button></div>
    ${p.habits.map(h => { const on = !!h.log[dayKey()], st = habitStreak(h); return `
      <div class="habit ${on ? 'on' : ''}">
        <button class="tick" data-habit="${h.id}" aria-pressed="${on}" aria-label="Mark “${esc(h.name)}” done today">${ICON.check}</button>
        <div class="name">${esc(h.name)}<div class="meta">+${h.xp} XP a day</div></div>
        ${S.habitEdit ? `<button class="btn ghost small" data-hdel="${h.id}">Remove</button>` : `<span class="hstreak" title="${st}-day streak">${ICON.flame}<span class="num">${st}</span></span>`}
      </div>`; }).join('')}
    ${S.habitEdit || !p.habits.length ? `<form class="row" id="hform"><input type="text" id="hname" placeholder="${p.habits.length ? 'Add a habit' : 'Add a daily habit, like “Code for 30 minutes”'}" maxlength="80" style="flex:1;min-width:0"><button class="btn" type="submit">Add</button></form>` : ''}
  </section>

  <section class="tracks">
    <div class="row between"><h2>Tracks</h2><span class="row"><label class="btn filebtn">Import .md<input type="file" id="imp" multiple accept=".md,.markdown,.txt,text/plain,text/markdown"></label><button class="btn primary" id="new">New track</button></span></div>
    ${tracks.length ? tracks.map(trackCard).join('') : `
      <div class="empty"><h3>No tracks yet</h3>
        <p class="muted">A track is one goal, like “Build my website”. Paste or upload the doc where you broke it into steps, and each step becomes a node on a path. Finish steps to earn XP and gems, open mystery chests, and spend gems on rewards you pick.</p>
        <div class="row"><button class="btn primary" id="new2">Create a track</button><button class="btn" id="example">Try an example</button></div></div>`}
    <p class="note">Drop .md files anywhere on this page to create or update tracks.</p>
  </section>
  <div class="row between"><p class="note">${store.mode === 'test' ? 'Test data, kept in this browser only.' : store.mode === 'db' ? 'Saved to your account. Only you can see your tracks.' : 'Saved in this browser only.'}</p>
    ${TEST.on ? '' : '<button class="btn ghost small" id="teston">Test mode</button>'}</div>`;
  bindHome();
}
function shopTeaser() {
  const p = S.p, items = p.shop.slice().sort((a, b) => a.cost - b.cost), next = items.find(r => r.cost > p.gems) || null, can = items.filter(r => r.cost <= p.gems).length;
  return `<button class="shopcard" id="openshop"><span class="gemicon">${ICON.gem}</span>
    <span class="name">Reward shop<span class="meta" style="display:block">${!items.length ? 'Add your own rewards and spend gems on them'
      : can ? `You can afford ${can} reward${can === 1 ? '' : 's'} right now` : `${next.cost - p.gems} more gems for ${esc(next.name)}`}</span></span>
    <span class="price">${ICON.gem}${p.gems}</span></button>`;
}
function trackCard(t) {
  const pct = trackPct(t), n = nextStep(t), a = allSteps(t);
  return `<button class="trackcard" data-open="${t.id}">
    <div style="min-width:0"><h3>${esc(t.name)}${t.example ? '<span class="tag">Example</span>' : ''}</h3>
      <div class="meta"><span class="num">${a.filter(s => s.done).length}/${a.length}</span> steps · <span class="num">${t.sections.length}</span> section${t.sections.length === 1 ? '' : 's'}</div></div>
    <span class="btn ${pct === 100 ? '' : 'gold'} small">${pct === 100 ? 'Done' : 'Continue'}</span>
    <div class="bar"><i style="width:${pct}%"></i></div>
    ${n ? `<div class="next"><span class="label">Next</span> ${esc(n.title)}</div>` : ''}</button>`;
}
function bindHome() {
  const on = (sel, ev, fn) => $app.querySelectorAll(sel).forEach(el => el.addEventListener(ev, fn));
  on('#new,#new2', 'click', () => { S.editId = null; S.draft = ''; S.view = 'edit'; render(); });
  on('#example', 'click', addExample);
  on('#teston', 'click', () => setTestMode(true));
  on('#imp', 'change', e => readImports(e.target.files));
  on('#openshop,#gemchip', 'click', () => { S.view = 'shop'; S.shopEdit = false; S.confirmBuy = null; render(); scrollTo(0, 0); });
  on('#goal', 'click', () => { const g = [20, 50, 100, 150]; S.p.goal = g[(g.indexOf(S.p.goal) + 1) % g.length]; store.saveProgress(); render(); });
  on('#hedit', 'click', () => { S.habitEdit = !S.habitEdit; render(); });
  on('[data-open]', 'click', e => openMap(e.currentTarget.dataset.open));
  on('[data-habit]', 'click', e => {
    const h = S.p.habits.find(x => x.id === e.currentTarget.dataset.habit), k = dayKey();

/* ---------- pomodoro timer ---------- */
/* The task's estimate ([45m], [1h30m], or its size) is split into 25-minute focus sessions with 5-minute breaks (15 after every 4th). */
const POMO = 25, SHORT_BREAK = 5, LONG_BREAK = 15, POMO_GEMS = 5;
const DEFAULT_MINS = { S: 25, M: 90, L: 240 };
const estMins = st => st.mins || DEFAULT_MINS[st.size];
const fmtMins = m => m >= 60 ? `${Math.floor(m / 60)}h${m % 60 ? ' ' + (m % 60) + 'm' : ''}` : `${m}m`;
const fmtClock = ms => { const s = Math.max(0, Math.ceil(ms / 1000)); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; };
function planFor(mins) { const n = Math.max(1, Math.ceil(mins / POMO)), out = []; for (let i = 0; i < n; i++) out.push(i < n - 1 ? POMO : Math.max(5, mins - POMO * (n - 1))); return out; }
const TK = () => TEST.on ? 'taskling.timer.test' : 'taskling.timer';
const MIN = () => TEST.on && TEST.fast ? 1000 : 60000;
let T = null, tickH = null, audio = null, wake = null;
try { T = JSON.parse(localStorage.getItem(TK())); } catch (e) {}
const saveT = () => { try { T ? localStorage.setItem(TK(), JSON.stringify(T)) : localStorage.removeItem(TK()); } catch (e) {} };
const phaseMs = () => (T.phase === 'break' ? T.breakMins : T.plan[T.idx]) * MIN();
const remaining = () => T.running ? T.endAt - Date.now() : T.remain;
function newTimer(st) { const plan = planFor(estMins(st)); return { stepId: st.id, plan, idx: 0, phase: 'work', running: false, remain: plan[0] * MIN(), endAt: null, breakMins: 0 }; }
function chime() {
  try {
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    [0, .28, .56].forEach((d, i) => { const o = audio.createOscillator(), g = audio.createGain(); o.frequency.value = [660, 880, 990][i];
      g.gain.setValueAtTime(.0001, audio.currentTime + d); g.gain.exponentialRampToValueAtTime(.25, audio.currentTime + d + .02); g.gain.exponentialRampToValueAtTime(.0001, audio.currentTime + d + .25);
      o.connect(g).connect(audio.destination); o.start(audio.currentTime + d); o.stop(audio.currentTime + d + .3); });
  } catch (e) {}
  try { navigator.vibrate?.([200, 100, 200]); } catch (e) {}
}
async function lockScreen(on) {
  try { if (on && !wake && navigator.wakeLock) { wake = await navigator.wakeLock.request('screen'); wake.addEventListener?.('release', () => wake = null); } else if (!on && wake) { await wake.release(); wake = null; } } catch (e) { wake = null; }
}
function timerStart(st) {
  try { audio = audio || new (window.AudioContext || window.webkitAudioContext)(); audio.resume?.(); } catch (e) {}
  if (!T || T.stepId !== st.id) { if (T) toast('Switched the timer to this task.'); T = newTimer(st); }
  if (T.phase === 'over') return;
  T.running = true; T.endAt = Date.now() + T.remain; saveT(); lockScreen(true); startTicking(); render();
}
function timerPause() { if (!T?.running) return; T.remain = T.endAt - Date.now(); T.running = false; saveT(); lockScreen(false); render(); }
function timerReset() { T = null; saveT(); lockScreen(false); render(); }
function timerSkip() { if (!T) return; T.remain = 0; T.endAt = Date.now(); T.running = true; advanceTimer(true); }
function advanceTimer(skipped) {
  const hit = findStep(T.stepId); if (!hit.st) { timerReset(); return; }
  if (!skipped) chime();
  if (T.phase === 'work') {
    if (!skipped) {
      hit.st.pomos = (hit.st.pomos || 0) + 1; S.p.gems += POMO_GEMS; store.saveTrack(hit.t); store.saveProgress();
      celebrate(`+${POMO_GEMS} gems`, `Focus session ${T.idx + 1} of ${T.plan.length} done`, false);
    }
    if (T.idx >= T.plan.length - 1) { T.phase = 'over'; T.running = false; T.remain = 0; lockScreen(false); }
    else { T.phase = 'break'; T.breakMins = (T.idx + 1) % 4 === 0 ? LONG_BREAK : SHORT_BREAK; T.remain = T.breakMins * MIN(); T.endAt = Date.now() + T.remain; T.running = true; }
  } else {
    T.idx++; T.phase = 'work'; T.remain = T.plan[T.idx] * MIN(); T.running = false; lockScreen(false);

  }

}
function startTicking() {

    paintTimer();
  }, 250);
}
function paintTimer() {
  if (!T) return;
  const left = remaining(), clock = fmtClock(left), frac = 1 - left / phaseMs();
  const c = document.getElementById('tclock'); if (c) c.textContent = clock;
  const r = document.getElementById('tring'); if (r) r.style.strokeDashoffset = String(TR_C * (1 - Math.min(1, Math.max(0, frac))));
  const m = document.getElementById('tminiclock'); if (m) m.textContent = clock;
}
const TR_C = 2 * Math.PI * 54;
function timerCard(st, done) {
  const mine = T && T.stepId === st.id, plan = mine ? T.plan : planFor(estMins(st));
  const t = mine ? T : null, phase = t ? t.phase : 'work', idx = t ? t.idx : 0, running = t?.running;
  const left = t ? remaining() : plan[0] * MIN(), total = phase === 'break' ? t.breakMins * MIN() : plan[Math.min(idx, plan.length - 1)] * MIN();
  const frac = phase === 'over' ? 1 : 1 - left / total;
  const label = phase === 'over' ? 'Estimated time is up' : phase === 'break' ? (t.breakMins === LONG_BREAK ? 'Long break' : 'Break') : `Focus session ${idx + 1} of ${plan.length}`;
  const dots = plan.map((_, i) => `<i class="${i < idx || phase === 'over' || (i === idx && phase === 'break') ? 'on' : i === idx ? 'cur' : ''}"></i>`).join('');
  return `<section class="timer ${phase}" aria-label="Pomodoro timer">
    <div class="row between"><span class="label">Pomodoro</span>
      <span class="row est">${done || mine ? '' : `<button class="btn ghost small" data-est="-5" aria-label="5 minutes less">−5</button>`}<span class="note num">Estimate ${fmtMins(estMins(st))}</span>${done || mine ? '' : `<button class="btn ghost small" data-est="5" aria-label="5 minutes more">+5</button>`}</span></div>
    <div class="tbody">
      <svg class="tring" viewBox="0 0 124 124" aria-hidden="true"><circle class="track" cx="62" cy="62" r="54"/><circle id="tring" class="fill" cx="62" cy="62" r="54" stroke-dasharray="${TR_C}" stroke-dashoffset="${TR_C * (1 - Math.min(1, Math.max(0, frac)))}" transform="rotate(-90 62 62)"/></svg>
      <div class="tcenter"><div class="tclock num" id="tclock" role="timer">${phase === 'over' ? '0:00' : fmtClock(left)}</div><div class="note">${label}</div></div>
    </div>
    <div class="dots" title="${plan.length} focus session${plan.length === 1 ? '' : 's'}">${dots}</div>
    ${done ? '' : phase === 'over' ? `<p class="note" style="text-align:center">${plan.length} session${plan.length === 1 ? '' : 's'} done. Finished the task? Tap Done below. <button class="btn ghost small" id="treset">Reset timer</button></p>`
      : `<div class="row" style="justify-content:center">${running ? `<button class="btn primary" id="tpause">Pause</button>` : `<button class="btn primary" id="tstart">${t && (t.remain < total || idx > 0) ? 'Resume' : phase === 'break' ? 'Start break' : 'Start focus'}</button>`}
        ${t ? `<button class="btn ghost small" id="tskip">${phase === 'break' ? 'Skip break' : 'Skip session'}</button><button class="btn ghost small" id="treset">Reset</button>` : ''}</div>`}
    ${st.pomos ? `<p class="note" style="text-align:center;margin:0">${st.pomos} focus session${st.pomos === 1 ? '' : 's'} spent on this task · +${POMO_GEMS} gems each</p>` : `<p class="note" style="text-align:center;margin:0">Each finished focus session earns +${POMO_GEMS} gems.</p>`}
  </section>`;
}
function bindTimer(t, st) {

  const parts = [...Array(big ? 140 : 60)].map(() => ({ x: innerWidth / 2, y: innerHeight / 2, vx: (Math.random() - .5) * (big ? 16 : 10), vy: -Math.random() * (big ? 14 : 10) - 3, r: Math.random() * 6 + 3, c: cols[Math.floor(Math.random() * cols.length)], a: Math.random() * 6 }));

      <button class="btn small ${TEST.jackpot ? 'gold' : ''}" id="tjack">${TEST.jackpot ? 'Jackpot armed' : 'Next chest: jackpot'}</button>
      <button class="btn small ${TEST.fast ? 'primary' : ''}" id="tfast" aria-pressed="${TEST.fast}">Fast timers: ${TEST.fast ? '1 sec = 1 min' : 'off'}</button>
      ${S.confirmTestReset ? `<button class="btn small" id="treset2" style="color:var(--bad)">Erase test data</button><button class="btn ghost small" id="treskeep">Keep</button>` : '<button class="btn ghost small" id="treset1">Reset test data</button>'}
      <button class="btn ghost small" id="testoff">Exit test mode</button></div></div>`;
  const on = (id, fn) => document.getElementById(id)?.addEventListener('click', fn);
  on('tday', () => {
    TEST.dayOffset++; saveTest();
    const b = JSON.stringify(S.p), m = reconcile(); if (JSON.stringify(S.p) !== b) store.saveProgress();
    render(); toast(m || `It’s now ${clockNow().toLocaleDateString(undefined, { weekday: 'long' })}. Habits reset for the new day.`);
  });
  on('tjack', () => { TEST.jackpot = !TEST.jackpot; saveTest(); renderTestBar(); });
  on('tfast', () => { TEST.fast = !TEST.fast; saveTest(); timerReset(); renderTestBar(); toast(TEST.fast ? 'Fast timers on. Restart the timer to use them.' : 'Timers back to real minutes.'); });
  on('treset1', () => { S.confirmTestReset = true; renderTestBar(); });
  on('treskeep', () => { S.confirmTestReset = false; renderTestBar(); });
  on('treset2', async () => {
    S.confirmTestReset = false;
    try { localStorage.removeItem(LS_TEST); localStorage.removeItem('taskling.timer.test'); } catch (e) {}
    TEST.dayOffset = 0; TEST.jackpot = false; saveTest(); await loadAll(); toast('Test data erased.');
  });
  on('testoff', () => setTestMode(false));
}
async function setTestMode(on) {
  if (T?.running) timerPause();
  TEST.on = on; TEST.jackpot = false; saveTest();
  await loadAll();
  scrollTo(0, 0); toast(on ? 'Test mode on. You’re in a sandbox now.' : 'Back to your real data.');
}
async function loadAll() {
  if (TEST.on) store.mode = 'test';
  else if (store.col) store.mode = 'db';
  else { store.mode = 'local'; await store.init(); }
  try { T = JSON.parse(localStorage.getItem(TK())); } catch (e) { T = null; }
  if (tickH) { clearInterval(tickH); tickH = null; }
  S.view = 'home'; S.result = null; S.pop = null; S.imports = null;
  const data = await store.load();
  S.tracks = data.tracks || []; S.p = Object.assign(freshProgress(), data.progress || {});
  for (const k of ['habits', 'shop', 'purchases']) if (!Array.isArray(S.p[k])) S.p[k] = [];
  const before = JSON.stringify(S.p), msg = reconcile();
  /* one-time: habits requested on Oct 11; the flag keeps a removed one from coming back */
  let added = 0;
  if (!S.p.habitSeed1) {
    for (const name of ['Mindfulness meditation', 'Morning stretching', 'Evening stretching', 'Roll my muscles']) {
      if (!S.p.habits.some(h => h.name.toLowerCase() === name.toLowerCase())) { S.p.habits.push({ id: uid(), name, xp: 10, log: {} }); added++; }
    }
    S.p.habitSeed1 = 1;
  }
  if (JSON.stringify(S.p) !== before) store.saveProgress();
  render(); renderTestBar(); resumeTimer(); if (msg || added) toast([added && `Added ${added} daily habit${added === 1 ? "" : "s"}`, msg].filter(Boolean).join(" · "));
}

/* ---------- boot ---------- */
(async () => { try {
  await loadAll();
  document.addEventListener('visibilitychange', () => {
    if (document.hidden || !S.p) return;
    const b = JSON.stringify(S.p), m = reconcile();
    if (JSON.stringify(S.p) !== b) { store.saveProgress(); if (S.view === 'home' || S.view === 'shop') render(); }
    if (m) toast(m);
  });
  try { S.downloads = await claude.use('downloads'); } catch (e) {}
  try { S.sample = await claude.use('sample'); if (S.view === 'edit') render(); } catch (e) {}
} catch (e) {
  $app.innerHTML = `<div class="top"><h1>Taskling</h1></div><div class="empty err-boot"><h3>Taskling couldn’t start</h3>
    <p class="muted">Your saved tracks are not affected. Reload to try again. If it keeps happening, send Claude this error:</p>
    <code class="note" style="overflow-wrap:anywhere">${esc(e?.message || e)}</code><button class="btn primary" onclick="location.reload()">Reload</button></div>`;
} })();
})();
</script>
