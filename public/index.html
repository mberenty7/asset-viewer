<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Asset Tracker</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎬</text></svg>">
  <link rel="stylesheet" href="tracker.css">
</head>
<body>
  <div id="app">
    <header>
      <h1>🎬 Asset Tracker</h1>
      <span class="stat" id="stat-line">—</span>
      <span class="spacer"></span>
      <input type="text" id="outdir" placeholder="comfyui-canvas output directory…" style="width:320px">
      <button id="btn-save-dir" title="Save output directory">Save</button>
      <button id="btn-scan" class="primary">⟳ Scan</button>
      <a href="/viewer.html" style="margin-left:8px;font-size:13px;text-decoration:none">🎲 3D Viewer</a>
    </header>

    <div id="body">
      <nav id="sidebar">
        <h2>Projects</h2>
        <div id="projects"></div>
      </nav>

      <main id="main">
        <div id="breadcrumb"></div>
        <div id="content"></div>
      </main>
    </div>
  </div>

  <div id="overlay">
    <aside id="detail">
      <div class="dhead">
        <span class="title" id="detail-title">Version</span>
        <button class="close" id="detail-close">✕ Close</button>
      </div>
      <div class="dbody" id="detail-body"></div>
    </aside>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    }
  }
  </script>
  <script type="module" src="tracker.js"></script>
</body>
</html>
