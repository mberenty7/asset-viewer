<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Asset Viewer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="viewer-container">
    <canvas id="viewer"></canvas>
  </div>

  <div id="sidebar">
    <h1>🎲 3D Viewer</h1>
    <a href="/" style="display:block;margin:-8px 0 12px;color:#8888ff;font-size:13px;text-decoration:none">← Back to Asset Tracker</a>

    <section id="model-section">
      <h2>Models</h2>
      <select id="model-select">
        <option value="">— loading —</option>
      </select>
      <div id="model-info"></div>
    </section>

    <section id="shader-section">
      <h2>Shader</h2>
      <select id="shader-select">
        <option value="fresnel">Fresnel</option>
        <option value="toon">Toon</option>
        <option value="holographic">Holographic</option>
      </select>

      <div id="shader-controls">
        <label>Base Color <input type="color" id="ctrl-color" value="#808080"></label>
        <label>Fresnel Power <input type="range" id="ctrl-fresnel" min="0.5" max="5" step="0.1" value="2.0"></label>
        <label>Rim Color <input type="color" id="ctrl-rim" value="#ffffff"></label>
      </div>

      <details>
        <summary>Edit Vertex Shader</summary>
        <textarea id="vert-editor" spellcheck="false"></textarea>
      </details>
      <details>
        <summary>Edit Fragment Shader</summary>
        <textarea id="frag-editor" spellcheck="false"></textarea>
      </details>
      <button id="apply-shader">Apply Shader</button>
      <div id="shader-error"></div>
    </section>

    <section id="scene-section">
      <h2>Scene</h2>
      <label>Background <input type="color" id="ctrl-bg" value="#1a1a2e"></label>
      <label>Auto-Rotate <input type="checkbox" id="ctrl-rotate"></label>
      <label>Show Grid <input type="checkbox" id="ctrl-grid"></label>
    </section>

    <section id="capture-section">
      <h2>Capture</h2>
      <label>Resolution
        <select id="capture-res">
          <option value="1024">1024×1024</option>
          <option value="896">896×1152</option>
          <option value="512">512×512</option>
          <option value="2048">2048×2048</option>
        </select>
      </label>
      <button id="capture-depth">📷 Depth Map</button>
      <button id="capture-depth4">📷 Depth 4-View</button>
      <button id="capture-normal">📷 Normal Map</button>
      <button id="capture-color">📷 Color Render</button>
    </section>
  </div>

  <div id="dropzone-overlay">Drop .glb / .gltf / .obj / .fbx file here</div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    }
  }
  </script>
  <script type="module" src="app.js"></script>
</body>
</html>
